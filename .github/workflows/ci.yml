name: CI

# Red de seguridad de la Ola 4: corre todas las suites del backend y compila y prueba el
# frontend en cada push/PR. NO ejecuta los guiones de diagnóstico de tests/ (ver
# tests/conftest.py); SCADA tiene valores ficticios y ninguna suite llama a XM de verdad.

on:
  push:
    branches: [master, main, "feature/**"]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sive_test
          POSTGRES_USER: sive
          POSTGRES_PASSWORD: sive
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-not-a-real-secret
      DEBUG: "False"
      # settings.py y scada_proxy/tasks.py (instancia ScadaConnectorClient al importar)
      # exigen estas al importar; los tests curados no tocan SCADA -> valores dummy.
      SCADA_BASE_URL: http://scada.invalid
      SCADA_USERNAME: ci
      SCADA_PASSWORD: ci
      # Nombres de variables tal cual los lee core/settings.py
      name_db: sive_test
      user_postgres: sive
      password_user_postgres: sive
      POSTGRES_HOST: localhost
      port_postgres: "5432"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de sistema para psycopg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libpq-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --upgrade pip && pip install -r requirements.txt
      - name: Migraciones sin deriva (models == migraciones)
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (todas las suites tests.test_* y tests.unit)
        # Corre cada tests/test_*.py, así que una suite nueva entra sola. Se excluyen los guiones
        # de diagnóstico que se llaman test_*.py pero no tienen ningún TestCase: se ejecutan a mano
        # contra una base real (ver tests/conftest.py, collect_ignore) y aquí no aportan pruebas.
        # Ninguna suite incluida necesita SCADA ni XM reales: las que los tocan usan dobles.
        run: |
          excluir='test_celery_tasks|test_device_repair|test_external_energy|test_weather_api|test_weather_historical_calculation'
          suites=$(cd tests && ls test_*.py | sed 's/\.py$//' | grep -Ev "^(${excluir})$" | sed 's/^/tests./')
          python manage.py test $suites tests.unit --verbosity=2

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Smoke test (Vitest)
        run: npm test
      - name: Build de producción (Vite)
        run: npm run build
